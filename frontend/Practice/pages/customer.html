
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer 360</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/customer.css">
    <link rel="stylesheet" href="../popup.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main customer-main-page">
      <section class="content customer-content">
        <div id="customers" class="customers-page">
          <div class="search-row customer-search-row">
            <input id="customerSearch" placeholder="Search customer by name, ID or segment..." oninput="filterCustomers()">
            <button class="secondary-btn">Search</button>
          </div>

          <div class="table-card customer-table-card">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Tier</th>
                  <th>Spend</th>
                  <th>Segment</th>
                  <th>Consent</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="customerRows"></tbody>
            </table>
          </div>
        </div>

        <div id="customerDetail" class="customer-detail-page" style="display:none;">
          <button class="secondary-btn" onclick="showCustomers()" style="margin-bottom:15px;">Back to Customers</button>
          <div id="customerDetailContent"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/navigation.js"></script>
    <script src="../popup.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/customer.js"></script>
  <script src="../js/customer-detail.js"></script>
  <script>
  if (typeof guardPage === "function") {
    guardPage("customers");
  }

  if (typeof loadNavigation === "function") {
    loadNavigation("customers");
  }

  loadCustomersFromBackend();
</script>
</body>
</html>
