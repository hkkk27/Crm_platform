<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body class="app-body">
    <!-- LOGIN PAGE -->
    <div id="login-page" class="auth-page-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="logo.png" alt="Company Logo" class="company-logo">
            </div>

            <form id="login-form" class="form-wrapper">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="login-email" required placeholder="kumar@omnilink.com" class="form-input">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="form-input">
                </div>

                <!-- Role -->
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="login-role" class="form-select">
                        <option value="System Administrator">System Administrator</option>
                        <option value="Marketing Team">Marketing Team</option>
                        <option value="Store Team">Store Team</option>
                        <option value="Management Team">Management Team</option>
                        <option value="Customer Service Team">Customer Service Team</option>
                        <option value="IT Team">IT Team</option>
                    </select>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-primary">Login</button>

                <!-- Forgot Password Below Login -->
                <div class="forgot-password-container">
                    <a href="forgot-password.html" id="forgot-password-link">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-stack-layer"></div>
    <script src="popup.js"></script>
    <script src="script.js"></script>
</body>
</html>
