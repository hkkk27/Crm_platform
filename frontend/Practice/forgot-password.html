<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body class="app-body">
    <div class="auth-page-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="logo.png" alt="Company Logo" class="company-logo">
            </div>

            <div id="emailScreen" class="reset-screen">
                <h2 class="reset-title">Reset Password</h2>
                <div class="form-group">
                    <input type="email" id="registeredEmail" class="form-input"
                        placeholder="Enter your registered email" required>
                </div>
                <button type="button" id="sendCodeBtn" class="btn-primary">
                    Send Reset Code
                </button>
            </div>

            <div id="otpScreen" class="reset-screen hidden">
                <h2 class="reset-title">Verify Reset Code</h2>
                <div class="form-group">
                    <label class="form-label">Reset Code</label>
                    <input type="text" id="otpCode" class="form-input" placeholder="Enter reset code" required>
                </div>
                <button type="button" id="verifyOtpBtn" class="btn-primary">
                    Continue
                </button>
            </div>

            <div id="passwordScreen" class="reset-screen hidden">
                <h2 class="reset-title">Create New Password</h2>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm Password"
                        required>
                </div>
                <button type="button" id="updatePasswordBtn" class="btn-primary">
                    Update Password
                </button>
            </div>

            <div id="successScreen" class="reset-screen hidden">
                <h2 class="reset-title success-title">Password Updated Successfully</h2>
            </div>

            <div class="forgot-password-container">
                <a href="login.html" class="back-login-link">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
    <script src="forgot-password.js"></script>
</body>

</html>
